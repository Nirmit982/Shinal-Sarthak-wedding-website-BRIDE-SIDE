<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery · Shinal &amp; Sarthak</title>
<meta name="description" content="Moments of Shinal &amp; Sarthak · Wedding 2–3 November 2026 · Blue World Castles, Kanpur">
<meta property="og:type" content="website">
<meta property="og:title" content="Gallery · Shinal &amp; Sarthak">
<meta property="og:description" content="A few of our favourite frames">
<meta property="og:image" content="https://sarthakshinalwedding.in/img/og-shinal.c2f93ac6.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#dccdb7">
<script>document.documentElement.className+=' js'</script>
<link rel="icon" type="image/png" href="/img/favicon.7241ec41.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.68fce808.png">
<link rel="stylesheet" href="/css/common.bc43e109.css">
<style>
.wall{columns:2 160px;column-gap:clamp(10px,2.4vw,20px);max-width:1180px;margin:clamp(20px,4vw,40px) auto 0;padding:0 var(--gut)}
@media (min-width:700px){.wall{columns:3 200px}}
@media (min-width:1100px){.wall{columns:4 220px}}
.ph{display:block;width:100%;margin:0 0 clamp(10px,2.4vw,20px);padding:clamp(5px,1.2vw,8px);border:0;background:#fffdf9;border-radius:6px;box-shadow:0 18px 30px -20px rgba(90,45,28,.55),0 0 0 1px rgba(176,132,51,.28);break-inside:avoid;cursor:zoom-in;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.ph:nth-child(4n+1){border-radius:999px 999px 6px 6px/42% 42% 6px 6px}
.ph img{width:100%;height:auto;border-radius:3px;background:#efe6da}
.ph:nth-child(4n+1) img{border-radius:999px 999px 3px 3px/41% 41% 3px 3px}
.ph:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 26px 36px -20px rgba(90,45,28,.6),0 0 0 1px rgba(176,132,51,.4)}
html.js .ph{opacity:0;transform:translateY(30px) scale(.97)}
html.js .ph.in{opacity:1;transform:none;transition:opacity .9s var(--ease),transform 1.1s var(--ease),box-shadow .5s var(--ease);transition-delay:var(--d,0ms)}
.soon{max-width:520px;width:calc(100% - 2 * var(--gut));margin:clamp(24px,5vw,40px) auto 0;padding:clamp(40px,8vw,60px) 24px;text-align:center;border:1px dashed rgba(176,132,51,.6);border-radius:50% 50% 18px 18px/120px 120px 18px 18px;background:rgba(255,251,246,.6)}
.soon img{width:60px;margin:0 auto 12px}
.soon p{font-family:var(--f-disp);font-style:italic;font-size:clamp(24px,5vw,32px);color:var(--brown)}
.soon small{display:block;margin-top:8px;color:#5b4c55;font-size:16px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:200;display:none;background:rgba(18,8,8,.94);touch-action:pan-y}
.lb.on{display:block;animation:lbin .35s ease}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb .stage{position:absolute;inset:calc(env(safe-area-inset-top) + 60px) 0 calc(env(safe-area-inset-bottom) + 64px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb img{max-width:calc(100% - 24px);max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .35s var(--ease),opacity .35s ease;user-select:none;-webkit-user-drag:none}
.lb .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#f7e6c6;font-family:var(--f-cap);font-weight:600;font-size:13px;letter-spacing:.2em}
.lb button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.lb button svg{width:22px;height:22px}
.lb .nav{position:absolute;top:50%;margin-top:-24px}
.lb .prev{left:12px}.lb .next{right:12px}
@media (hover:none){.lb .nav{display:none}}
.lb .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);text-align:center;color:rgba(247,230,198,.7);font-style:italic;font-size:14px}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="page grain">
  <header class="topbar">
    <a class="back" href="/" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>MAIN</a>
    <span class="tb-title">Gallery</span>
    <img class="tb-mono" src="/img/monogram.3688b7e9.png" alt="" width="479" height="736">
  </header>

  <section class="page-hero">
    <p class="eyebrow" data-r>Shinal &amp; Sarthak</p>
    <h1 class="split" data-r><span class="sr">Our Moments</span><span aria-hidden="true"><span class="w"><span class="l" style="--i:0">O</span><span class="l" style="--i:1">u</span><span class="l" style="--i:2">r</span></span> <span class="w"><span class="l" style="--i:4">M</span><span class="l" style="--i:5">o</span><span class="l" style="--i:6">m</span><span class="l" style="--i:7">e</span><span class="l" style="--i:8">n</span><span class="l" style="--i:9">t</span><span class="l" style="--i:10">s</span></span></span></h1>
    <p class="sub" data-r>A few of our favourite frames. Tap any photo to see it big.</p>
    <div class="orn" data-r="fade"><img src="/img/lotus.5ed2afc0.png" alt="" width="91" height="70"></div>
  </section>

  <div class="wall" id="wall"></div>
  <div class="soon" data-r><img src="/img/lotus.5ed2afc0.png" alt="" width="91" height="70"><p>Photos coming soon</p><small>Check back closer to the wedding.</small></div>

  <footer class="foot">
    <p class="tag shimmer">#ShiGotHerHak</p>
    <div class="row">
      <a class="btn pri" href="/invite/" id="to-invite">Open the Invite</a>
      <a class="btn" href="/wardrobe/" id="to-ward">Wardrobe Planner</a>
    </div>
  </footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="top"><span id="lbc">1 / 1</span><button id="lbx" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="stage" id="stage"><img id="lbi" alt=""></div>
  <button class="nav prev" id="lbp" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="nav next" id="lbn" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <p class="hint">Swipe to see more</p>
</div>

<script>
(function(){
  var d=document, W=window, $=function(s){return d.querySelector(s)}, $$=function(s){return [].slice.call(d.querySelectorAll(s))};
  var reduce=W.matchMedia&&W.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{ var q=new URLSearchParams(location.search), guest=(q.get('to')||'').replace(/[<>]/g,'').trim().slice(0,60);
    if(guest){ var enc='?to='+encodeURIComponent(guest); ['#back','#to-invite','#to-ward'].forEach(function(s){ var a=$(s); a.href=a.getAttribute('href')+enc; }); } }catch(e){}
  var io=('IntersectionObserver' in W)? new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }); },{rootMargin:'0px 0px -5% 0px',threshold:.05}) : null;
  $$('[data-r]').forEach(function(el){ io? io.observe(el) : el.classList.add('in'); });
  $$('.ph').forEach(function(el,i){ el.style.setProperty('--d',((i%4)*90)+'ms'); io? io.observe(el) : el.classList.add('in'); });
  if(!reduce){ var P=$('#petals'), n=innerWidth<700?4:6; for(var i=0;i<n;i++){ var s=d.createElement('i'); s.style.left=(Math.random()*100)+'%'; s.style.animationDuration=(12+Math.random()*9)+'s'; s.style.animationDelay=(-Math.random()*18)+'s'; s.style.opacity=(.4+Math.random()*.4).toFixed(2); P.appendChild(s);} }
  /* lightbox */
  var items=$$('.ph'), lb=$('#lb'), im=$('#lbi'), cnt=$('#lbc'), cur=0, last=null;
  if(!items.length) return;
  function show(i,dir){
    cur=(i+items.length)%items.length; var b=items[cur];
    if(dir&&!reduce){ im.style.transition='none'; im.style.transform='translateX('+(dir*40)+'px)'; im.style.opacity='0'; void im.offsetWidth; im.style.transition=''; }
    im.src=b.getAttribute('data-full'); im.alt=b.querySelector('img').alt||'';
    im.onload=function(){ im.style.transform=''; im.style.opacity='1'; };
    if(im.complete) im.onload();
    cnt.textContent=(cur+1)+' / '+items.length;
    var nx=new Image(); nx.src=items[(cur+1)%items.length].getAttribute('data-full');
  }
  function open(i){ last=d.activeElement; lb.classList.add('on'); d.documentElement.style.overflow='hidden'; show(i); $('#lbx').focus(); }
  function close(){ lb.classList.remove('on'); d.documentElement.style.overflow=''; im.removeAttribute('src'); if(last) last.focus(); }
  items.forEach(function(b,i){ b.addEventListener('click',function(){ open(i); }); });
  $('#lbx').addEventListener('click',close);
  $('#lbp').addEventListener('click',function(){ show(cur-1,-1); });
  $('#lbn').addEventListener('click',function(){ show(cur+1,1); });
  $('#stage').addEventListener('click',function(e){ if(e.target.id==='stage') close(); });
  d.addEventListener('keydown',function(e){ if(!lb.classList.contains('on')) return; if(e.key==='Escape') close(); if(e.key==='ArrowRight') show(cur+1,1); if(e.key==='ArrowLeft') show(cur-1,-1); });
  var sx=0, sy=0, dx=0, tr=false;
  lb.addEventListener('touchstart',function(e){ if(e.touches.length!==1) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; tr=true; im.style.transition='none'; },{passive:true});
  lb.addEventListener('touchmove',function(e){ if(!tr) return; dx=e.touches[0].clientX-sx; var dy=e.touches[0].clientY-sy; if(Math.abs(dx)>Math.abs(dy)) im.style.transform='translateX('+dx+'px)'; },{passive:true});
  lb.addEventListener('touchend',function(){ if(!tr) return; tr=false; im.style.transition=''; if(dx<-50) show(cur+1,1); else if(dx>50) show(cur-1,-1); else im.style.transform=''; });
})();
</script>
</body>
</html>
